<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="CreditSea loan application and management.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="creditsea_app">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>creditsea_app</title>
  <link rel="manifest" href="manifest.json">

  <!-- Razorpay Checkout for Web -->
  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>

  <script>
    window.openRazorpayWebCheckout = function(optionsJson) {
      try {
        var options = JSON.parse(optionsJson);

        options.handler = function(response) {
          if (window.onRazorpayWebSuccess) {
            window.onRazorpayWebSuccess(
              response.razorpay_order_id || '',
              response.razorpay_payment_id || '',
              response.razorpay_signature || ''
            );
          }
        };

        options.modal = {
          ondismiss: function() {
            if (window.onRazorpayWebDismiss) {
              window.onRazorpayWebDismiss();
            }
          }
        };

        var rzp = new Razorpay(options);

        rzp.on('payment.failed', function(resp) {
          if (window.onRazorpayWebFailure) {
            var errMsg = (resp && resp.error && resp.error.description) 
              ? resp.error.description 
              : 'Payment failed';
            window.onRazorpayWebFailure(errMsg);
          }
        });

        rzp.open();
      } catch (err) {
        console.error('Razorpay Web Checkout error:', err);
        if (window.onRazorpayWebFailure) {
          window.onRazorpayWebFailure(err.toString());
        }
      }
    };
  </script>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
